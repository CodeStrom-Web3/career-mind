<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - CareerMind AI</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>

<aside class="sidebar" id="sidebar">

    <!-- =================================
         SIDEBAR HEADER
    ================================== -->

    <div class="sidebar-header">

        <span class="sidebar-section-title">
            MAIN
        </span>

    </div>


    <!-- =================================
         MAIN NAVIGATION
    ================================== -->

    <nav class="sidebar-navigation">

        <!-- Dashboard -->

        <a
            href="../../pages/dashboard.html"
            class="sidebar-item active"
            data-page="dashboard"
        >

            <span class="sidebar-icon">
                ▦
            </span>

            <span class="sidebar-text">
                Dashboard
            </span>

        </a>


        <!-- Career Profile -->

        <a
            href="../../pages/career-profile.html"
            class="sidebar-item"
            data-page="career-profile"
        >

            <span class="sidebar-icon">
                ◎
            </span>

            <span class="sidebar-text">
                Career Profile
            </span>

        </a>


        <!-- AI Assistant -->

        <a
            href="../../pages/career-assistant.html"
            class="sidebar-item"
            data-page="career-assistant"
        >

            <span class="sidebar-icon">
                ✦
            </span>

            <span class="sidebar-text">
                AI Assistant
            </span>

        </a>


        <!-- Career Roadmap -->

        <a
            href="../../pages/roadmap.html"
            class="sidebar-item"
            data-page="roadmap"
        >

            <span class="sidebar-icon">
                ◈
            </span>

            <span class="sidebar-text">
                Career Roadmap
            </span>

        </a>

    </nav>


    <!-- =================================
         CAREER MEMORY SECTION
    ================================== -->

    <div class="sidebar-section">

        <span class="sidebar-section-title">
            CAREER MEMORY
        </span>


        <!-- Memory Center -->

        <a
            href="../../pages/memory-center.html"
            class="sidebar-item"
            data-page="memory-center"
        >

            <span class="sidebar-icon">
                🧠
            </span>

            <span class="sidebar-text">
                Memory Center
            </span>

        </a>


        <!-- Projects -->

        <a
            href="../../pages/projects.html"
            class="sidebar-item"
            data-page="projects"
        >

            <span class="sidebar-icon">
                ◇
            </span>

            <span class="sidebar-text">
                Projects
            </span>

        </a>

    </div>


    <!-- =================================
         SIDEBAR BOTTOM
    ================================== -->

    <div class="sidebar-bottom">

        <!-- Help Card -->

        <div class="sidebar-help">

            <div class="help-icon">
                ?
            </div>

            <div class="help-content">

                <strong>
                    Need help?
                </strong>

                <span>
                    Ask CareerMind AI
                </span>

            </div>

        </div>


        <!-- Collapse Button -->

        <button
            class="sidebar-collapse"
            id="sidebarCollapse"
            type="button"
            aria-label="Collapse sidebar"
        >

            <span>
                «
            </span>

            <span class="collapse-text">
                Collapse
            </span>

        </button>

    </div>

</aside>
<script src="sidebar.js"></script>
</body>
</html>
